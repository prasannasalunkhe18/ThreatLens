[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatlens"
version = "0.1.0"
description = "PR vulnerability triage agent — threat modeling + reachability investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]
# Discovery layer. Semgrep ships a native binary only for Linux/macOS (and WSL);
# on Windows the discovery layer falls back to the official semgrep/semgrep
# Docker image, so this extra is not required there.
semgrep = [
    "semgrep>=1.60; platform_system != 'Windows'",
]

[project.scripts]
threatlens = "threatlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
